<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CliniBud — Understand Your Health, Without the Medical Jargon</title>
<meta name="description" content="Upload your medical reports and CliniBud explains the important numbers in plain language, keeps every report together, and tracks how your results change over time." />
<style>


:root {
  
  --brand-25:  #F6FBF7;
  --brand-50:  #EAF5EC;
  --brand-100: #D5EBDA;
  --brand-150: #C2E2CA;
  --brand-200: #B7DCC0;
  --brand-300: #8FC79D;
  --brand-400: #63AD78;
  --brand-500: #479761;
  --brand-600: #2E7D4D;
  --brand-700: #1F5C38;
  --brand-800: #163F27;
  --brand-900: #0F2A1A;

  
  --ink:        #16261C;
  --muted:      #4B5F51;
  --muted-lt:   #64796A;
  --border:     #D2E5D7;
  --border-soft:#E4F1E7;
  --surface:    #FFFFFF;
  --surface-tint: #F6FBF7;
  --card:       #EFF8F1;

  
  --status-good:     #0C8A3E;
  --status-good-bg:  #E4F5E9;
  --status-warning:  #A9660A;
  --status-warning-bg: #FCEFD9;
  --status-serious:  #B14A1F;
  --status-serious-bg: #FBE6DA;
  --status-critical: #B3241C;
  --status-critical-bg: #FBE2DF;
  --status-neutral:  #5B6B63;
  --status-neutral-bg: #ECEFEC;

  
  --chart-line: #1F7A4C;
  --chart-band: #E4F5E9;
  --chart-grid: #E1EAE3;

  --radius-s: 8px;
  --radius-m: 14px;
  --radius-l: 22px;
  --shadow-card: 0 2px 14px rgba(15, 42, 26, 0.07);
  --shadow-pop: 0 10px 34px rgba(15, 42, 26, 0.16);
  --maxw: 1180px;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --font-head: Georgia, "Cambria", "Times New Roman", serif;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  font-family: var(--font);
  color: var(--ink);
  background: var(--surface);
  font-size: 17px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
img, svg { max-width: 100%; display: block; }
a { color: var(--brand-700); }
h1, h2, h3, h4 { font-family: var(--font-head); font-weight: 700; color: var(--brand-800); line-height: 1.2; margin: 0 0 .5em; }
h1 { font-size: clamp(32px, 5vw, 52px); }
h2 { font-size: clamp(24px, 3.4vw, 34px); }
h3 { font-size: 20px; }
p { margin: 0 0 1em; }
.container { max-width: var(--maxw); margin: 0 auto; padding: 0 24px; }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.tiny { font-size: 12.5px; }


a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, [tabindex]:focus-visible {
  outline: 3px solid var(--brand-500);
  outline-offset: 2px;
  border-radius: 4px;
}


.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  font-family: var(--font); font-size: 16px; font-weight: 700;
  padding: 14px 26px; border-radius: 999px; border: 2px solid transparent;
  cursor: pointer; text-decoration: none; min-height: 48px; line-height: 1;
  transition: transform .06s ease, box-shadow .15s ease, background .15s ease;
}
.btn:active { transform: translateY(1px); }
.btn-primary { background: var(--brand-600); color: #fff; }
.btn-primary:hover { background: var(--brand-700); }
.btn-secondary { background: var(--brand-50); color: var(--brand-800); border-color: var(--brand-200); }
.btn-secondary:hover { background: var(--brand-100); }
.btn-ghost { background: transparent; color: var(--brand-700); border-color: var(--border); }
.btn-ghost:hover { background: var(--brand-50); }
.btn-block { width: 100%; }
.btn-sm { padding: 10px 18px; font-size: 14px; min-height: 40px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }


.site-header {
  position: sticky; top: 0; z-index: 50;
  background: rgba(246, 251, 247, 0.92); backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--border-soft);
}
.nav-row { display: flex; align-items: center; justify-content: space-between; padding: 14px 24px; max-width: var(--maxw); margin: 0 auto; }
.brand-mark { display: flex; align-items: center; gap: 10px; text-decoration: none; font-family: var(--font-head); font-weight: 700; font-size: 21px; color: var(--brand-800); }
.brand-mark .leaf { width: 34px; height: 34px; }
.nav-links { display: flex; align-items: center; gap: 26px; list-style: none; margin: 0; padding: 0; }
.nav-links a { color: var(--brand-800); text-decoration: none; font-weight: 600; font-size: 15px; }
.nav-links a:hover { color: var(--brand-600); }
.nav-cta { display: flex; align-items: center; gap: 12px; }
.nav-toggle { display: none; background: none; border: 2px solid var(--border); border-radius: 10px; padding: 8px 10px; cursor: pointer; }
.disclaimer-strip {
  background: var(--brand-800); color: #EAF5EC; font-size: 13.5px; text-align: center;
  padding: 8px 16px;
}
.disclaimer-strip strong { color: #fff; }


.site-footer { background: var(--brand-900); color: #D7E8DB; padding: 56px 0 26px; margin-top: 90px; }
.footer-grid { display: grid; grid-template-columns: 1.4fr 1fr 1fr 1fr; gap: 32px; }
.footer-grid h4 { color: #fff; font-family: var(--font); font-size: 14px; letter-spacing: .04em; text-transform: uppercase; margin-bottom: 14px; }
.footer-grid a { color: #BFDAC6; text-decoration: none; font-size: 14.5px; display: block; margin-bottom: 10px; }
.footer-grid a:hover { color: #fff; }
.footer-bottom { border-top: 1px solid rgba(255,255,255,.12); margin-top: 40px; padding-top: 22px; font-size: 13px; color: #9FC0A8; }
.footer-disclaimer { background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12); border-radius: var(--radius-m); padding: 16px 20px; font-size: 13.5px; color: #D7E8DB; margin-bottom: 30px; }


.card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-m); padding: 22px; }
.card-surface { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-m); box-shadow: var(--shadow-card); }
.section { padding: 78px 0; }
.section-tight { padding: 40px 0; }
.eyebrow { text-transform: uppercase; letter-spacing: .08em; font-size: 13px; font-weight: 700; color: var(--brand-600); margin-bottom: 10px; }


.badge { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; padding: 6px 12px; border-radius: 999px; white-space: nowrap; }
.badge-good { background: var(--status-good-bg); color: var(--status-good); }
.badge-warning { background: var(--status-warning-bg); color: var(--status-warning); }
.badge-serious { background: var(--status-serious-bg); color: var(--status-serious); }
.badge-critical { background: var(--status-critical-bg); color: var(--status-critical); }
.badge-neutral { background: var(--status-neutral-bg); color: var(--status-neutral); }
.badge svg { width: 14px; height: 14px; flex: none; }


.hero { padding: 74px 0 40px; position: relative; overflow: hidden; }
.hero-grid { display: grid; grid-template-columns: 1.1fr .9fr; gap: 50px; align-items: center; }
.hero-copy p.lede { font-size: 19px; color: var(--muted); max-width: 52ch; }
.hero-actions { display: flex; align-items: center; gap: 16px; margin-top: 26px; flex-wrap: wrap; }
.hero-note { font-size: 13.5px; color: var(--muted-lt); margin-top: 10px; }
.hero-art { background: linear-gradient(160deg, var(--brand-100), var(--brand-50)); border-radius: 28px; padding: 26px; border: 1px solid var(--brand-150); }


.problem-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
.benefit-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
.problem-item { display: flex; gap: 14px; align-items: flex-start; padding: 18px; }
.problem-item .icon-chip { flex: none; }
.solution-list { list-style: none; padding: 0; margin: 22px 0 0; display: grid; gap: 14px; }
.solution-list li { display: flex; gap: 12px; align-items: flex-start; }
.solution-list li svg { flex: none; margin-top: 3px; color: var(--brand-600); }
.benefit-card { padding: 26px; }
.benefit-num { font-family: var(--font-head); font-size: 30px; color: var(--brand-300); font-weight: 700; margin-bottom: 6px; }

.icon-chip { display: inline-flex; align-items: center; justify-content: center; width: 46px; height: 46px; border-radius: 14px; background: var(--brand-100); color: var(--brand-700); flex: none; }
.icon-chip svg { width: 24px; height: 24px; }
.icon-chip.lg { width: 60px; height: 60px; border-radius: 18px; }
.icon-chip.lg svg { width: 30px; height: 30px; }
.icon-chip.dark { background: var(--brand-700); color: #fff; }

.faq-item { border-bottom: 1px solid var(--border); padding: 20px 0; }
.faq-q { display: flex; width: 100%; justify-content: space-between; align-items: center; gap: 16px; background: none; border: none; text-align: left; cursor: pointer; padding: 0; font: inherit; }
.faq-q h3 { margin: 0; font-size: 17.5px; color: var(--brand-800); }
.faq-q .chev { transition: transform .2s ease; color: var(--brand-500); flex: none; }
.faq-item[open] .faq-q .chev { transform: rotate(180deg); }
.faq-a { color: var(--muted); padding-top: 12px; max-width: 74ch; }
.faq-item summary::-webkit-details-marker { display: none; }
.faq-item summary { list-style: none; }

.cta-band { background: linear-gradient(135deg, var(--brand-700), var(--brand-800)); color: #fff; border-radius: var(--radius-l); padding: 56px; text-align: center; }
.cta-band h2 { color: #fff; }
.cta-band p { color: var(--brand-100); }

.proof-note { background: var(--brand-50); border: 1px dashed var(--brand-200); border-radius: var(--radius-m); padding: 22px; font-size: 14.5px; color: var(--muted); }

.app-shell { display: grid; grid-template-columns: 264px 1fr; min-height: 100vh; background: var(--surface-tint); }
.app-nav { background: var(--brand-800); color: #EAF5EC; padding: 22px 16px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
.app-nav-head { display: flex; align-items: center; justify-content: space-between; }
.app-nav .brand-mark { color: #fff; padding: 6px 10px 26px; }
.app-nav-close { display: none; background: none; border: none; color: #EAF5EC; padding: 8px; margin: 4px 4px 0 0; border-radius: 8px; cursor: pointer; }
.app-nav-close:hover { background: rgba(255,255,255,.08); }
.app-nav-close svg { width: 20px; height: 20px; display: block; }
.app-nav-backdrop { display: none; }
.app-nav-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.app-nav-list button { width: 100%; display: flex; align-items: center; gap: 12px; background: none; border: none; color: #CFE6D6; font: inherit; font-size: 15px; font-weight: 600; text-align: left; padding: 12px 14px; border-radius: 12px; cursor: pointer; min-height: 46px; }
.app-nav-list button:hover { background: rgba(255,255,255,.06); color: #fff; }
.app-nav-list button.active { background: var(--brand-500); color: #fff; }
.app-nav-list svg { width: 19px; height: 19px; flex: none; }
.app-nav-foot { margin-top: 26px; padding-top: 18px; border-top: 1px solid rgba(255,255,255,.12); font-size: 12.5px; color: #9FC0A8; }
.app-main { padding: 30px 40px 80px; max-width: 1040px; }
.app-topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 26px; flex-wrap: wrap; gap: 14px; }
.app-view { display: none; }
.app-view.active { display: block; }
.patient-chip { display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--border); border-radius: 999px; padding: 6px 16px 6px 6px; }
.avatar { width: 34px; height: 34px; border-radius: 50%; background: var(--brand-300); color: var(--brand-900); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; }

.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
.stack { display: grid; gap: 20px; }
.field-row { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--border-soft); font-size: 14.5px; }
.field-row:last-child { border-bottom: none; }
.field-row .k { color: var(--muted); }
.field-row .v { font-weight: 600; text-align: right; }
.dash-card h3 { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; font-size: 15.5px; text-transform: uppercase; letter-spacing: .03em; color: var(--brand-700); }
.dash-card h3 svg { width: 18px; height: 18px; color: var(--brand-500); }
.linklike { background: none; border: none; color: var(--brand-700); font-weight: 700; font-size: 14px; cursor: pointer; padding: 0; }

.result-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-m); margin-bottom: 14px; overflow: hidden; }
.result-head { width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 14px; padding: 16px 18px; background: none; border: none; cursor: pointer; text-align: left; font: inherit; min-height: 56px; }
.result-head:hover { background: var(--brand-25); }
.result-head-left { display: flex; align-items: center; gap: 12px; }
.result-name { font-weight: 700; font-size: 16px; color: var(--ink); }
.result-meta { font-size: 12.5px; color: var(--muted-lt); margin-top: 2px; }
.result-chev { color: var(--brand-500); transition: transform .18s; flex: none; }
.result-card.open .result-chev { transform: rotate(180deg); }
.result-body { display: none; padding: 4px 18px 20px; border-top: 1px solid var(--border-soft); }
.result-card.open .result-body { display: block; }
.field-block { margin-bottom: 14px; }
.field-block .lab { font-size: 11.5px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; color: var(--brand-600); margin-bottom: 4px; }
.field-block .val { font-size: 15px; }
.field-block .val.hero { font-size: 22px; font-weight: 700; }
.discuss-list { margin: 6px 0 0; padding-left: 20px; }
.discuss-list li { margin-bottom: 6px; font-size: 14.5px; }
.range-bar { position: relative; height: 10px; border-radius: 999px; background: var(--border-soft); margin: 10px 0 18px; }
.range-bar .band { position: absolute; top: 0; bottom: 0; background: var(--status-good-bg); border-radius: 999px; }
.range-bar .marker { position: absolute; top: -5px; width: 4px; height: 20px; border-radius: 2px; background: var(--ink); }
.range-labels { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--muted-lt); margin-top: -12px; margin-bottom: 16px; }

.summary-strip { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin: 18px 0 26px; }
.summary-tile { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-m); padding: 16px; text-align: center; }
.summary-tile .n { font-size: 26px; font-weight: 800; font-family: var(--font-head); }
.summary-tile .lbl { font-size: 12.5px; color: var(--muted); margin-top: 4px; display: flex; align-items: center; justify-content: center; gap: 5px; }
.summary-tile .lbl svg { width: 14px; height: 14px; flex: none; }

.sample-switch { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 22px; }
.sample-switch button { border: 1.5px solid var(--border); background: var(--surface); border-radius: 999px; padding: 8px 16px; font-size: 13.5px; font-weight: 700; color: var(--brand-800); cursor: pointer; min-height: 40px; }
.sample-switch button.active { background: var(--brand-600); border-color: var(--brand-600); color: #fff; }

.stepper { display: flex; align-items: center; gap: 6px; margin-bottom: 30px; }
.stepper .dot { width: 30px; height: 30px; border-radius: 50%; background: var(--border-soft); color: var(--muted-lt); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; flex: none; }
.stepper .dot.done { background: var(--brand-600); color: #fff; }
.stepper .dot.current { background: var(--brand-100); color: var(--brand-800); border: 2px solid var(--brand-600); }
.stepper .bar { flex: 1; height: 3px; background: var(--border-soft); }
.stepper .bar.done { background: var(--brand-600); }
.upload-drop { border: 2px dashed var(--brand-200); border-radius: var(--radius-l); padding: 46px 24px; text-align: center; background: var(--brand-25); }
.upload-choices { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-top: 22px; }
.upload-choice { border: 1.5px solid var(--border); background: var(--surface); border-radius: var(--radius-m); padding: 20px; text-align: center; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; }
.upload-choice:hover { border-color: var(--brand-400); background: var(--brand-25); }
.confirm-row { display: flex; justify-content: space-between; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--border-soft); }
.progress-ring { width: 84px; height: 84px; margin: 0 auto 18px; }

.timeline { position: relative; padding-left: 34px; }
.timeline::before { content: ""; position: absolute; left: 10px; top: 6px; bottom: 6px; width: 2px; background: var(--border); }
.tl-item { position: relative; padding-bottom: 26px; }
.tl-item::before { content: ""; position: absolute; left: -34px; top: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--brand-500); border: 3px solid var(--surface-tint); }
.tl-item.visit::before { background: var(--brand-800); }
.tl-date { font-size: 12.5px; font-weight: 800; color: var(--brand-600); letter-spacing: .03em; }

.safety-banner { background: var(--status-critical-bg); border: 1.5px solid var(--status-critical); border-radius: var(--radius-m); padding: 18px 20px; display: flex; gap: 14px; align-items: flex-start; margin-bottom: 22px; }
.safety-banner svg { flex: none; color: var(--status-critical); width: 26px; height: 26px; margin-top: 2px; }
.safety-banner h3 { color: var(--status-critical); margin-bottom: 6px; font-size: 17px; }
.safety-banner p { color: #6E1712; margin-bottom: 6px; font-size: 14.5px; }
.safety-banner .num { font-weight: 800; }

.need-context-banner { background: var(--status-neutral-bg); border: 1.5px solid var(--border); border-radius: var(--radius-m); padding: 16px 18px; display: flex; gap: 12px; align-items: flex-start; margin-bottom: 20px; }
.need-context-banner svg { flex: none; color: var(--status-neutral); width: 22px; height: 22px; }

.state-block { text-align: center; padding: 54px 24px; }
.state-block .icon-chip { margin: 0 auto 18px; }
.state-block h3 { margin-bottom: 8px; }
.state-block p { color: var(--muted); max-width: 46ch; margin: 0 auto 20px; }

.field { margin-bottom: 16px; }
.field label { display: block; font-weight: 700; font-size: 14px; margin-bottom: 6px; color: var(--brand-800); }
.field input, .field select { width: 100%; padding: 13px 16px; border-radius: 12px; border: 1.5px solid var(--border); font-size: 16px; font-family: inherit; background: var(--surface); min-height: 48px; }
.field input:focus, .field select:focus { border-color: var(--brand-500); outline: none; box-shadow: 0 0 0 4px var(--brand-100); }
.segmented { display: flex; border: 1.5px solid var(--border); border-radius: 999px; padding: 4px; background: var(--surface); width: fit-content; margin: 0 auto 26px; }
.segmented button { border: none; background: none; padding: 10px 22px; border-radius: 999px; font-weight: 700; cursor: pointer; font-size: 14.5px; color: var(--muted); min-height: 40px; }
.segmented button.active { background: var(--brand-600); color: #fff; }

.chart-wrap { position: relative; }
.chart-legend-note { font-size: 13px; color: var(--muted); margin-top: 8px; }
.chart-tooltip { position: absolute; background: var(--brand-800); color: #fff; font-size: 12.5px; padding: 8px 11px; border-radius: 8px; pointer-events: none; opacity: 0; transition: opacity .1s; white-space: nowrap; transform: translate(-50%, -110%); z-index: 5; }
.chart-tooltip.show { opacity: 1; }

.flex { display: flex; }
.between { justify-content: space-between; }
.center { align-items: center; }
.gap-8 { gap: 8px; } .gap-12 { gap: 12px; } .gap-16 { gap: 16px; } .gap-24 { gap: 24px; }
.mt-0 { margin-top: 0; } .mb-0 { margin-bottom: 0; }
.pill-tag { display: inline-block; background: var(--brand-100); color: var(--brand-800); font-size: 12.5px; font-weight: 700; padding: 5px 12px; border-radius: 999px; margin: 0 6px 6px 0; }
.divider { height: 1px; background: var(--border-soft); margin: 26px 0; border: none; }
.skip-link { position: absolute; left: -999px; top: 0; background: var(--brand-700); color: #fff; padding: 12px 18px; z-index: 100; border-radius: 0 0 10px 0; }
.skip-link:focus { left: 0; }
.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

@media (max-width: 980px) {
  .hero-grid, .grid-2, .grid-3, .problem-grid, .benefit-grid, .footer-grid, .summary-strip, .upload-choices { grid-template-columns: 1fr; }
  .app-shell { grid-template-columns: 1fr; }
  .app-nav { position: fixed; left: 0; top: 0; bottom: 0; width: 78vw; max-width: 300px; transform: translateX(-100%); transition: transform .2s ease; z-index: 60; height: 100vh; }
  .app-nav.open { transform: translateX(0); box-shadow: var(--shadow-pop); }
  .app-nav-close { display: inline-flex; }
  .app-nav-backdrop.open { display: block; position: fixed; inset: 0; background: rgba(15,42,26,.5); z-index: 55; }
  .app-main { padding: 22px 18px 90px; }
  .nav-links { display: none; }
  .nav-cta .btn { display: none; }
  .nav-toggle { display: inline-flex; align-items: center; justify-content: center; flex: none; }
  .summary-strip { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 640px) {
  body { font-size: 16px; }
  .cta-band { padding: 36px 22px; }

<script>

function renderLineChart(container, cfg) {
  const W = 640, H = 220, PAD = { t: 20, r: 26, b: 34, l: 44 };
  const plotW = W - PAD.l - PAD.r;
  const plotH = H - PAD.t - PAD.b;

  const points = cfg.points;
  const values = points.map((p) => p.value);
  let lo = cfg.range ? cfg.range.lo : Math.min(...values);
  let hi = cfg.range ? cfg.range.hi : Math.max(...values);
  const dataMin = Math.min(...values, lo);
  const dataMax = Math.max(...values, hi);
  const pad = (dataMax - dataMin) * 0.18 || 1;
  const yMin = dataMin - pad, yMax = dataMax + pad;

  const x = (i) => PAD.l + (points.length === 1 ? plotW / 2 : (i / (points.length - 1)) * plotW);
  const y = (v) => PAD.t + plotH - ((v - yMin) / (yMax - yMin)) * plotH;

  const svgns = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(svgns, "svg");
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.setAttribute("role", "img");
  svg.setAttribute("aria-label", `${cfg.title} trend chart: ${cfg.note}`);
  svg.style.width = "100%";
  svg.style.height = "auto";
  svg.style.overflow = "visible";

  function el(tag, attrs) {
    const e = document.createElementNS(svgns, tag);
    Object.entries(attrs).forEach(([k, v]) => e.setAttribute(k, v));
    return e;
  }

  // Reference / target band
  if (cfg.range && points.length > 1) {
    svg.appendChild(el("rect", {
      x: PAD.l, y: y(cfg.range.hi), width: plotW, height: Math.max(2, y(cfg.range.lo) - y(cfg.range.hi)),
      fill: "var(--chart-band)",
    }));
    svg.appendChild(el("text", { x: PAD.l + 4, y: y(cfg.range.hi) - 6, class: "chart-band-label", fill: "var(--status-good)", "font-size": "10.5", "font-weight": "700" })).textContent = `Report range ${cfg.range.lo}–${cfg.range.hi} ${cfg.unit}`;
  }

  // Gridlines (recessive)
  [0.25, 0.5, 0.75].forEach((f) => {
    const gy = PAD.t + plotH * f;
    svg.appendChild(el("line", { x1: PAD.l, x2: W - PAD.r, y1: gy, y2: gy, stroke: "var(--chart-grid)", "stroke-width": 1 }));
  });
  // Baseline
  svg.appendChild(el("line", { x1: PAD.l, x2: W - PAD.r, y1: PAD.t + plotH, y2: PAD.t + plotH, stroke: "var(--border)", "stroke-width": 1 }));

  // Line path
  if (points.length > 1) {
    const d = points.map((p, i) => `${i === 0 ? "M" : "L"} ${x(i)} ${y(p.value)}`).join(" ");
    svg.appendChild(el("path", { d, fill: "none", stroke: "var(--chart-line)", "stroke-width": 2.5, "stroke-linecap": "round", "stroke-linejoin": "round" }));
  }

  // Markers + x labels
  points.forEach((p, i) => {
    svg.appendChild(el("circle", { cx: x(i), cy: y(p.value), r: 5, fill: "var(--surface)", stroke: "var(--chart-line)", "stroke-width": 2.5 }));
    svg.appendChild(el("text", { x: x(i), y: H - 10, "text-anchor": "middle", "font-size": "10.5", fill: "var(--muted-lt)" })).textContent = p.date;
  });

  // Direct end label — latest value
  const last = points[points.length - 1];
  svg.appendChild(el("text", {
    x: x(points.length - 1) + (points.length > 1 ? 10 : 0), y: y(last.value) - 12,
    "text-anchor": points.length > 1 ? "start" : "middle", "font-size": "13", "font-weight": "800", fill: "var(--brand-800)",
  })).textContent = `${last.value} ${cfg.unit}`;

  // Hover layer: crosshair + tooltip
  const hitAreas = [];
  points.forEach((p, i) => {
    const hit = el("circle", { cx: x(i), cy: y(p.value), r: 14, fill: "transparent", class: "chart-hit" });
    svg.appendChild(hit);
    hitAreas.push({ el: hit, i, p });
  });

  container.innerHTML = "";
  const wrap = document.createElement("div");
  wrap.className = "chart-wrap";
  wrap.appendChild(svg);
  const tip = document.createElement("div");
  tip.className = "chart-tooltip";
  wrap.appendChild(tip);
  container.appendChild(wrap);

  hitAreas.forEach(({ el: hit, i, p }) => {
    const show = (evt) => {
      tip.textContent = `${p.date} — ${p.value} ${cfg.unit}`;
      const rect = wrap.getBoundingClientRect();
      const svgRect = svg.getBoundingClientRect();
      const px = svgRect.left - rect.left + (x(i) / W) * svgRect.width;
      const py = svgRect.top - rect.top + (y(p.value) / H) * svgRect.height;
      tip.style.left = px + "px";
      tip.style.top = py + "px";
      tip.classList.add("show");
    };
    hit.addEventListener("mouseenter", show);
    hit.addEventListener("focus", show);
    hit.addEventListener("mouseleave", () => tip.classList.remove("show"));
    hit.addEventListener("blur", () => tip.classList.remove("show"));
  });

  return svg;
}

</script>

function rangeBarHTML(r) {
  if (!r) return "";
  const span = r.hi - r.lo;
  const padded = span * 1.4 || 1;
  const min = r.lo - padded * 0.3, max = r.hi + padded * 0.3;
  const pct = (v) => Math.max(0, Math.min(100, ((v - min) / (max - min)) * 100));
  return `
    <div class="range-bar">
      <div class="band" style="left:${pct(r.lo)}%; width:${pct(r.hi) - pct(r.lo)}%;"></div>
      <div class="marker" style="left:calc(${pct(r.value)}% - 2px);"></div>
    </div>
    <div class="range-labels"><span>${r.lo}</span><span>Report range</span><span>${r.hi}</span></div>
  `;
}

  document.querySelectorAll(".app-nav-list button").forEach((b) => b.classList.toggle("active", b.dataset.view === view));
  document.getElementById("viewTitle").textContent = VIEW_TITLES[view];

  if (view === "upload") { uploadStep = 1; drawStepper(); drawUploadStep(); }
  closeMobileNav();
  window.scrollTo({ top: 0, behavior: "instant" });
}

<script>

const PAGE_RENDERERS = { home: renderHomePage, faq: renderFaqPage, security: renderSecurityPage, login: renderLoginPage };
const MARKETING_PAGES = new Set(["home", "faq", "security", "login"]);
const APP_VIEWS = new Set(["overview", "upload", "reports", "trends", "timeline", "visit", "states"]);
const pageRendered = {};

function showMarketing(page, anchor) {
  document.getElementById("appShell").style.display = "none";
  document.getElementById("marketingShell").style.display = "";
  document.querySelectorAll("#marketingShell .page").forEach((p) => p.classList.remove("active"));
  document.getElementById("page-" + page).classList.add("active");
  if (!pageRendered[page]) { PAGE_RENDERERS[page](); pageRendered[page] = true; }
  initChrome(page);
  if (anchor) {
    requestAnimationFrame(() => requestAnimationFrame(() => {
      document.getElementById(anchor)?.scrollIntoView({ behavior: "smooth" });
    }));
  } else {
    window.scrollTo({ top: 0, behavior: "instant" });
  }
}

function showApp() {
  document.getElementById("marketingShell").style.display = "none";
  document.getElementById("appShell").style.display = "";
}

function router() {
  const raw = window.location.hash.replace(/^#/, "");
  const [route, anchor] = raw.split(":");
  const r = route || "home";
  if (APP_VIEWS.has(r)) {
    showApp();
    setView(r);
  } else if (MARKETING_PAGES.has(r)) {
    showMarketing(r, anchor);
  } else {
    showMarketing("home");
  }
}
window.addEventListener("hashchange", router);
document.addEventListener("DOMContentLoaded", router);

</script>
